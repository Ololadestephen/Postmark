<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f3f3ee; --ink: #1c1c18; --charcoal: #32312f; --gray: #787873;
    --deep: #23663f; --leaf: #7db069; --salmon: #f1a783;
    --orange: #ce8e3d; --mustard: #ddc362;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    font-family: "Inter Tight", ui-sans-serif, system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    position: relative;
  }
  .layout {
    position: relative; z-index: 2; height: 100%;
    display: grid; grid-template-columns: 1.45fr .8fr; align-items: center;
    padding: 80px 110px 210px; gap: 60px;
  }
  .mark { display: flex; align-items: center; gap: 18px; }
  .eyebrow {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 24px; letter-spacing: .3em; text-transform: uppercase;
    color: var(--deep);
  }
  h1 {
    font-size: 118px; font-weight: 600; line-height: .98;
    letter-spacing: -0.025em; margin-top: 26px;
  }
  h1 .hl { color: var(--deep); }
  .tagline { font-size: 44px; font-weight: 500; color: var(--charcoal); margin-top: 28px; }
  .sub {
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 20px; line-height: 1.7; color: var(--gray); margin-top: 26px; max-width: 34em;
  }
  .foot {
    position: absolute; left: 110px; bottom: 190px; z-index: 3;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 19px; letter-spacing: .18em; color: var(--gray); text-transform: uppercase;
  }
  .foot b { color: var(--ink); font-weight: 500; }

  /* pixel postage stamp: notched edge + deep-green face + mustard check */
  .stamp { position: relative; justify-self: center; transform: rotate(-4deg); }
  .stamp svg { display: block; filter: drop-shadow(0 34px 50px rgba(28,28,24,.35)); }
  .stamp .caption {
    position: absolute; left: 0; right: 0; bottom: -52px; text-align: center;
    font-family: "IBM Plex Mono", monospace; font-size: 20px; font-weight: 500;
    letter-spacing: .3em; text-transform: uppercase; color: var(--gray);
  }

  /* signature pixel band along the bottom */
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 1; }
</style>
</head>
<body>
  <svg class="band" viewBox="0 0 1920 150" preserveAspectRatio="none" aria-hidden="true" id="band"></svg>

  <div class="layout">
    <div>
      <div class="mark">
        <!-- Postmark logo: folded-paper P (same paths as app/public/favicon.svg) -->
        <svg viewBox="0 0 32 32" width="76" height="76" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2f5746"/><path fill="#f7f6f1" fill-rule="evenodd" d="M8 25V7h11l5 5v5a5 5 0 0 1-5 5h-6v3zm5-13v5h5a2.5 2.5 0 0 0 0-5z"/><path fill="#b7c9b7" d="M19 7v5h5z"/></svg>
        <div class="eyebrow">QoreChain · Build Before Q-Day</div>
      </div>
      <h1>Bounties that<br>pay when the<br>work is <span class="hl">verified.</span></h1>
      <div class="tagline">Postmark — Real issues, testnet payouts.</div>
      <div class="sub">GitHub bounties released by 2-of-3 ML-DSA-87 verifier verdicts on QoreChain</div>
    </div>
    <div class="stamp">
      <svg viewBox="0 0 460 520" width="420" height="475" aria-hidden="true" id="stamp"></svg>
      <div class="caption">postmark · diana</div>
    </div>
  </div>

  <div class="foot">diana testnet · <b>test QOR, no monetary value</b></div>

<script>
// pixel-perforated stamp with VERIFIED seal
const S = 40; // pixel size
const svg = document.getElementById("stamp");
const ns = "http://www.w3.org/2000/svg";
const R = (x,y,w,h,f)=>{const r=document.createElementNS(ns,"rect");
  r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);
  r.setAttribute("fill",f);svg.appendChild(r);};
// face
R(2*S/10,2*S/10,440,500,"#23663f");
// perforations: paper notches around the rim
for (let x=8;x<440;x+=24){ R(x,0,12,14,"#f3f3ee"); R(x,506,12,14,"#f3f3ee"); }
for (let y=8;y<500;y+=24){ R(0,y,14,12,"#f3f3ee"); R(446,y,14,12,"#f3f3ee"); }
// inner border + seal
const t=document.createElementNS(ns,"text");
const rect=(x,y,w,h,stroke)=>{const r=document.createElementNS(ns,"rect");
  r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);
  r.setAttribute("fill","none");r.setAttribute("stroke",stroke);r.setAttribute("stroke-width","4");svg.appendChild(r);};
rect(36,36,388,448,"#ddc362");
const txt=(x,y,str,size,fill,ls)=>{const e=document.createElementNS(ns,"text");
  e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("font-family","IBM Plex Mono,monospace");
  e.setAttribute("font-size",size);e.setAttribute("font-weight","500");e.setAttribute("fill",fill);
  e.setAttribute("text-anchor","middle");e.setAttribute("letter-spacing",ls);e.textContent=str;svg.appendChild(e);};
txt(230,120,"VERIFIED",52,"#f3f3ee",8);
txt(230,168,"· · ·",36,"#ddc362",10);
txt(230,250,"2 OF 3",64,"#ddc362",10);
txt(230,330,"ML-DSA-87",46,"#f3f3ee",6);
// check mark
const p=document.createElementNS(ns,"path");
p.setAttribute("d","M170 420 l50 50 l90 -105");
p.setAttribute("fill","none");p.setAttribute("stroke","#f3f3ee");
p.setAttribute("stroke-width","22");p.setAttribute("stroke-linecap","square");
svg.appendChild(p);

// bottom pixel band: stripes with dithered stair edges
const band=document.getElementById("band");
const cols=["#23663F","#7DB069","#F1A783","#CE8E3D","#DDC362"];
const sh=30, px=8;
const br=(x,y,w,h,f)=>{const r=document.createElementNS(ns,"rect");
  r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);
  r.setAttribute("fill",f);band.appendChild(r);};
for(let i=0;i<cols.length;i++){
  if(i>0)for(let r=0;r<3;r++)for(let j=0;j<480;j++)
    if((j+r+i)%2===0)br(j*px*2+((r+i)%2)*px, i*sh-(3-r)*px, px, px, cols[i]);
  br(0,i*sh,1920,sh,cols[i]);
}
</script>
</body>
</html>
